config.tomlを作成する

 - default_config_file_pathにあるconfig.tomlの接続情報を見る
 snow --info

- config.tomlを作成する
snow connectionでも作成可能ですが、今回は用意しました。

- config.tomlをフォルダへ配置する
cp config.toml ../../.snowflake/

キーペアを作成する
mkdir -p ~/.snowflake/keys && chmod 700 ~/.snowflake/keys
cd ~/.snowflake/keys
openssl genrsa 2048 | openssl pkcs8 -topk8 -inform PEM -out rsa_key.p8 -nocrypt

openssl rsa -in rsa_key.p8 -pubout -out rsa_key.pub
grep -v '^----' rsa_key.pub | tr -d '\n'; echo

出力結果をSnowsightからユーザーへ登録する

フィンガープリントを検証する

openssl rsa -pubin -in rsa_key.pub -outform DER | openssl dgst -sha256 -binary | openssl enc -base64

接続のテストをする
cd ~/repos/frosty-friday
snow connection test

config.tomlを修正して再度配置する
cp config.toml ../../.snowflake/

接続のテストをする
snow connection test
